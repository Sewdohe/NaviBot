[package]
name = "navi_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# The Core Runtime
tokio = { version = "1", features = ["full"] }

# The Discord Interface
poise = "0.6"

# The Lua Bridge (We will use this later, but let's install it now)
mlua = { version = "0.9", features = ["lua54", "async", "serialize", "send", "vendored"] }

# Utilities
serde = { version = "1", features = ["derive"] } # For handling JSON/Config data
serde_json = "1"
dotenvy = "0.15"                                 # To load your .env file (token)

rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
